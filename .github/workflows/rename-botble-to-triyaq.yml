name: Refactor Botble ➜ Triyaq

on:
  workflow_dispatch:
    inputs:
      new_namespace:
        description: 'Replace Botble\\ with this namespace'
        required: true
        default: 'Triyaq'   # غيّرها لـ Tiryaq لو ده اللي عايزه
      package_name:
        description: 'Optional: set composer.json name to this (e.g., triyaq/dev-tool)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run automated refactor
        env:
          NEW_NS: ${{ github.event.inputs.new_namespace }}
          PKG_NAME: ${{ github.event.inputs.package_name }}
        run: |
          set -euo pipefail

          BRANCH="chore/rename-botble-to-${NEW_NS,,}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # 1) Rename any directory named Botble -> $NEW_NS (deepest first)
          find . -type d -name "Botble" \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" \
            | sort -r | while IFS= read -r d; do
              newdir="$(dirname "$d")/${NEW_NS}"
              echo "📁 Rename: $d -> $newdir"
              git mv "$d" "$newdir"
            done

          # 2) Replace namespaces and qualified refs in files
          #    namespace Botble\X  -> namespace NEW_NS\X
          #    use Botble\X        -> use NEW_NS\X
          #    \Botble\X           -> \NEW_NS\X
          find . -type f \( -name "*.php" -o -name "*.md" -o -name "*.stub" -o -name "*.json" -o -name "*.lock" -o -name "*.dist" \) \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" -print0 \
            | xargs -0 perl -0777 -i -pe "
              s/^\\s*namespace\\s+Botble\\\\(\\S*)/namespace ${NEW_NS}\\\\\$1/gm;
              s/^\\s*use\\s+Botble\\\\/use ${NEW_NS}\\\\/gm;
              s/\\\\Botble\\\\/\\\\${NEW_NS}\\\\/g;
            "

          # 3) Update composer.json PSR-4 autoload from "Botble\\": "src/" to "${NEW_NS}\\": "src/"
          if [ -f composer.json ]; then
            perl -0777 -i -pe '
              s/"psr-4"\s*:\s*\{([^}]*)\}/
                do {
                  my $blk = $1;
                  $blk =~ s/"Botble\\\\"\s*:\s*"([^"]*)"/"'\"${NEW_NS//\//\\/}\"'\\\\": "$1"/g;
                  "\"psr-4\": {$blk}"
                }/gex;
            ' composer.json

            # Optional: set package "name"
            if [ -n "$PKG_NAME" ]; then
              perl -0777 -i -pe 's/"name"\s*:\s*"[a-z0-9._-]+\/[a-z0-9._-]+"/"name": "'$PKG_NAME'"/i' composer.json
            fi
          fi

          # 4) Show diff & commit if changes exist
          if git diff --quiet; then
            echo "ℹ️ No changes detected."
            exit 0
          fi

          git add -A
          git commit -m "refactor: rename Botble namespace to ${NEW_NS}"
          git push -u origin "$BRANCH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.ref_name }}
          title: 'refactor: rename Botble ➜ ${{ github.event.inputs.new_namespace }}'
          body: |
            Automated namespace refactor:
            - `namespace Botble\…` ➜ `namespace ${{ github.event.inputs.new_namespace }}\…`
            - `use Botble\…` ➜ `use ${{ github.event.inputs.new_namespace }}\…`
            - `\Botble\…` ➜ `\${{ github.event.inputs.new_namespace }}\…`
            - PSR-4 updated in `composer.json`
            ${{ github.event.inputs.package_name != '' && format('- Package name set to `{0}`', github.event.inputs.package_name) || '' }}
          labels: |
            chore
            refactor
