name: Refactor Botble to Triyaq

on:
  workflow_dispatch:
    inputs:
      new_namespace:
        description: 'Replace Botble\\ with this namespace'
        required: false
        default: 'Triyaq'
      package_name:
        description: 'Optional composer package name, e.g. triyaq/dev-tool'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    env:
      NEW_NS: ${{ github.event.inputs.new_namespace }}
      PKG_NAME: ${{ github.event.inputs.package_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run automated refactor
        shell: bash
        run: |
          set -euo pipefail

          : "${NEW_NS:=Triyaq}"
          : "${PKG_NAME:=}"

          BRANCH="chore/rename-botble-to-$(echo "${NEW_NS}" | tr '[:upper:]' '[:lower:]')"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # 1) Rename directories named "Botble" -> "${NEW_NS}" (deepest first)
          find . -type d -name "Botble" \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" \
            | sort -r | while IFS= read -r d; do
              newdir="$(dirname "$d")/${NEW_NS}"
              echo "📁 Rename: $d -> $newdir"
              git mv "$d" "$newdir"
            done

          # 2) Replace namespaces and qualified refs in files
          find . -type f \( -name "*.php" -o -name "*.md" -o -name "*.stub" -o -name "*.json" -o -name "*.lock" -o -name "*.dist" \) \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" -print0 \
            | xargs -0 perl -0777 -i -pe '
              s/^\s*namespace\s+Botble\\(\S*)/namespace '"${NEW_NS}"'\\$1/gm;
              s/^\s*use\s+Botble\\/use '"${NEW_NS}"'\\/gm;
              s/\\Botble\\/\\'"${NEW_NS}"'\\/g;
            '

          # 3) Update composer.json (PSR-4 + optional name) using jq
          if [ -f composer.json ]; then
            NS_ESC="${NEW_NS}\\\\"
            jq --arg ns "$NS_ESC" --arg pkg "${PKG_NAME}" '
              # autoload.psr-4
              ( if .autoload and .autoload["psr-4"] and .autoload["psr-4"]["Botble\\"] then
                  .autoload["psr-4"] |= ( . as $root | del(."Botble\\") + { ($ns): $root["Botble\\"] } )
                else . end ) |
              # autoload-dev.psr-4
              ( if .["autoload-dev"] and .["autoload-dev"]["psr-4"] and .["autoload-dev"]["psr-4"]["Botble\\"] then
                  .["autoload-dev"]["psr-4"] |= ( . as $root | del(."Botble\\") + { ($ns): $root["Botble\\"] } )
                else . end ) |
              # optional package name
              ( if $pkg != "" then .name = $pkg else . end )
            ' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          fi

          # 4) Commit & push if anything changed
          if git diff --quiet; then
            echo "ℹ️ No changes detected."
          else
            git add -A
            git commit -m "refactor: rename Botble namespace to ${NEW_NS}"
            git push -u origin "$BRANCH"
          fi

          # Pass values to PR step
          echo "BRANCH_NAME=${BRANCH}" >> "$GITHUB_ENV"
          echo "NS_FOR_TITLE=${NEW_NS}" >> "$GITHUB_ENV"
          if [ -n "$PKG_NAME" ]; then
            echo "PKG_LINE=- Package name set to \`${PKG_NAME}\`" >> "$GITHUB_ENV"
          else
            echo "PKG_LINE=" >> "$GITHUB_ENV"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.BRANCH_NAME }}
          base: develop
          title: "refactor: rename Botble -> ${{ env.NS_FOR_TITLE }}"
          body: |
            Automated namespace refactor:
            - `namespace Botble\…` -> `namespace ${{ env.NS_FOR_TITLE }}\…`
            - `use Botble\…` -> `use ${{ env.NS_FOR_TITLE }}\…`
            - `\Botble\…` -> `\${{ env.NS_FOR_TITLE }}\…`
            - PSR-4 updated in `composer.json`
            ${{ env.PKG_LINE }}
          labels: |
            chore
            refactor
