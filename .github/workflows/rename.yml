name: Refactor Botble ➜ Triyaq

on:
  workflow_dispatch:
    inputs:
      new_namespace:
        description: 'Replace Botble\\ with this namespace'
        required: true
        default: 'Triyaq'   # أو اكتب Tiryaq وقت التشغيل لو حابب
      package_name:
        description: 'Optional: set composer.json name (e.g., triyaq/dev-tool)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run automated refactor
        env:
          NEW_NS: ${{ github.event.inputs.new_namespace }}
          PKG_NAME: ${{ github.event.inputs.package_name }}
        run: |
          set -euo pipefail

          BRANCH="chore/rename-botble-to-$(echo "${NEW_NS}" | tr '[:upper:]' '[:lower:]')"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # 1) Rename any directory named Botble -> $NEW_NS (deepest first)
          find . -type d -name "Botble" \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" \
            | sort -r | while IFS= read -r d; do
              newdir="$(dirname "$d")/${NEW_NS}"
              echo "📁 Rename: $d -> $newdir"
              git mv "$d" "$newdir"
            done

          # 2) Replace namespaces and qualified refs in files (safe quoting)
          find . -type f \( -name "*.php" -o -name "*.md" -o -name "*.stub" -o -name "*.json" -o -name "*.lock" -o -name "*.dist" \) \
            -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./storage/*" -print0 \
            | xargs -0 perl -0777 -i -pe '
              s/^\s*namespace\s+Botble\\(\S*)/namespace '"${NEW_NS}"'\\$1/gm;
              s/^\s*use\s+Botble\\/use '"${NEW_NS}"'\\/gm;
              s/\\Botble\\/\\'"${NEW_NS}"'\\/g;
            '

          # 3) Update composer.json via Python (avoids perl quoting issues)
          if [ -f composer.json ]; then
            python3 - <<'PY'
import json, os, sys, pathlib
ns = os.environ["NEW_NS"]
pkg = os.environ.get("PKG_NAME","")
p = pathlib.Path("composer.json")
data = json.loads(p.read_text())
changed = False

for key in ("autoload", "autoload-dev"):
    if key in data and isinstance(data[key], dict) and "psr-4" in data[key]:
        psr = data[key]["psr-4"]
        if "Botble\\" in psr:
            psr[ns + "\\"] = psr.pop("Botble\\")
            changed = True

if pkg:
    data["name"] = pkg
    changed = True

if changed:
    p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
else:
    print("No composer.json changes needed")
PY
          fi

          # 4) Commit & push if changes exist
          if git diff --quiet; then
            echo "ℹ️ No changes detected."
          else
            git add -A
            git commit -m "refactor: rename Botble namespace to ${NEW_NS}"
            git push -u origin "$BRANCH"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ format('chore/rename-botble-to-{0}', (github.event.inputs.new_namespace || 'Triyaq') ) }}
          base: develop
          title: 'refactor: rename Botble ➜ ${{ github.event.inputs.new_namespace || '' }}'
          body: |
            Automated namespace refactor:
            - `namespace Botble\…` ➜ `namespace ${{ github.event.inputs.new_namespace || 'Triyaq' }}\…`
            - `use Botble\…` ➜ `use ${{ github.event.inputs.new_namespace || 'Triyaq' }}\…`
            - `\Botble\…` ➜ `\${{ github.event.inputs.new_namespace || 'Triyaq' }}\…`
            - PSR-4 updated in `composer.json`
            ${{ github.event.inputs.package_name != '' && format('- Package name set to `{0}`', github.event.inputs.package_name) || '' }}
          labels: |
            chore
            refactor
